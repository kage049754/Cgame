name: Survival 21 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blackjack-tests:
    name: Blackjack rules and project validation
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/blackjack_rules.gd
          test -f scripts/main.gd
          test -f scripts/survival_run.gd
          test -f scripts/opponent_profiles.gd
          test -f scripts/dealer_character.gd
          test -f scripts/survival_items.gd
          test -f scripts/survival_save.gd
          test -f scripts/encounter_events.gd
          test -f scripts/procedural_audio.gd
          test -f tests/audio_generation_test.gd
          test -f scripts/settings_store.gd
          test -f scripts/progression.gd
          test -f scripts/controller_input.gd
          test -f scripts/accessibility_layout.gd
          test -f assets/icon.svg
          test -f tests/settings_test.gd
          test -f tests/accessibility_test.gd
          test -f scenes/dealer_character.tscn
          test -f assets/characters/quaternius_superhero_male.glb
          test -f assets/enemies/quaternius_zombie_basic.gltf
          test -f assets/environment/street_4way.gltf
          test -f assets/environment/streetlights.gltf
          test -f assets/environment/container_red.gltf
          test -f assets/environment/container_green.gltf
          test -f scripts/zombie_enemy.gd
          test -f tests/zombie_animation_test.gd
          test -f scenes/zombie_enemy.tscn
          test -f assets/licenses/QUATERNIUS-CC0-1.0.txt
          test -f export_presets.cfg
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run gameplay rule tests
        run: godot --headless --path . --script res://tests/run_tests.gd
      - name: Verify settings persistence
        run: godot --headless --path . --script res://tests/settings_test.gd
      - name: Verify screen-reader metadata and focus flow
        run: godot --headless --path . --script res://tests/accessibility_test.gd
      - name: Verify procedural audio generation
        run: godot --headless --path . --script res://tests/audio_generation_test.gd
      - name: Verify Quaternius zombie animations
        run: godot --headless --path . --script res://tests/zombie_animation_test.gd
      - name: Headless scene smoke test
        shell: bash
        run: |
          timeout 20s godot --headless --path . --quit-after 5 > /tmp/main-scene.log 2>&1
          cat /tmp/main-scene.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/main-scene.log; then
            echo "Main scene emitted a script parse/load error."
            exit 1
          fi

  android-debug-apk:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    needs: blackjack-tests
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install download utilities
        run: |
          apt-get update -qq
          apt-get install -y -qq curl unzip file
      - name: Install required Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.1/aapt"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
      - name: Install matching Godot Android export templates
        run: |
          GODOT_VERSION="4.7.2"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/godot-templates/templates.tpz
          unzip -q /tmp/godot-templates/templates.tpz -d /tmp/godot-templates/unpacked
          cp -a /tmp/godot-templates/unpacked/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"
          test -f "$TEMPLATE_DIR/version.txt"
          ls -lh "$TEMPLATE_DIR"/android_*.apk
      - name: Configure Android SDK paths
        run: |
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$HOME/.android/debug.keystore"
          java -version
          cat "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export and verify Android APK
        run: |
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --verbose --path . --export-debug "Android" build/Survival21.apk 2>&1 | tee /tmp/android-export.log
          test -s build/Survival21.apk
          unzip -t build/Survival21.apk
          unzip -l build/Survival21.apk | grep -E 'lib/arm64-v8a/.*\.so'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/Survival21.apk | tee /tmp/apk-badging.txt
          grep -F "package: name='com.kage049754.survival21'" /tmp/apk-badging.txt
          grep -F "native-code: 'arm64-v8a'" /tmp/apk-badging.txt
      - name: Export Windows Desktop build
        run: |
          godot --headless --verbose --path . --export-debug "Windows Desktop" build/Survival21.exe
          test -s build/Survival21.exe
          file build/Survival21.exe | grep -E 'PE32\+.*x86-64|PE32\+ executable'
      - name: Export x86_64 Android emulator APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --verbose --path . --export-debug "Android Emulator x86_64" build/Survival21-Emulator.apk
          test -s build/Survival21-Emulator.apk
          unzip -t build/Survival21-Emulator.apk
          unzip -l build/Survival21-Emulator.apk | grep -E 'lib/x86_64/.*\.so'
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/Survival21-Emulator.apk | tee /tmp/emulator-badging.txt
          grep -F "package: name='com.kage049754.survival21'" /tmp/emulator-badging.txt
          grep -F "native-code: 'x86_64'" /tmp/emulator-badging.txt
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Survival21-Android-arm64-debug
          path: build/Survival21.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: Survival21-Android-x86_64-emulator
          path: build/Survival21-Emulator.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows Desktop build
        uses: actions/upload-artifact@v4
        with:
          name: Survival21-Windows-x86_64-debug
          path: build/Survival21.exe
          if-no-files-found: error
          retention-days: 14
  android-emulator-smoke:
    name: Android emulator install and launch
    runs-on: ubuntu-latest
    needs: android-debug-apk
    steps:
      - name: Download x86_64 emulator APK
        uses: actions/download-artifact@v4
        with:
          name: Survival21-Android-x86_64-emulator
          path: build
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install build/Survival21-Emulator.apk
            adb shell monkey -p com.kage049754.survival21 -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.kage049754.survival21
            adb logcat -d -s AndroidRuntime:E | tee /tmp/survival21-crash.log
            if grep -E "FATAL EXCEPTION|Process .* has died" /tmp/survival21-crash.log; then
              echo "SURVIVAL 21 crashed on the Android emulator."
              exit 1
            fi
