name: Survival 21 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blackjack-tests:
    name: Blackjack rules and project validation
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/blackjack_rules.gd
          test -f scripts/main.gd
          test -f scripts/survival_run.gd
          test -f export_presets.cfg
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Run gameplay rule tests
        run: godot --headless --path . --script res://tests/run_tests.gd
      - name: Headless scene smoke test
        run: timeout 20s godot --headless --path . --quit-after 5

  android-debug-apk:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    needs: blackjack-tests
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Verify Android export toolchain
        run: |
          test -d "$ANDROID_HOME"
          java -version
      - name: Export and verify Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Survival21.apk
          test -s build/Survival21.apk
          unzip -t build/Survival21.apk
          unzip -l build/Survival21.apk | grep -E 'lib/arm64-v8a/.*\.so'
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Survival21-Android-arm64-debug
          path: build/Survival21.apk
          if-no-files-found: error
          retention-days: 14
